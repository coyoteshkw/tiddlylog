name: Deploy TiddlyWiki to Pages

on:
  push:
    branches:
      - main

# 权限设置：允许 Actions 修改 Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # --- 核心优化 1：开启内置的 npm 缓存 ---
          cache: "npm"

      - name: Install TiddlyWiki
        # --- 核心优化 2：如果没有 package.json，我们通过特定逻辑安装 ---
        # 如果你仓库里有 package.json，直接用 npm install
        run: |
          if [ -f package.json ]; then
            npm install
          else
            npm install -g tiddlywiki
          fi

      - name: Build Static Site and Sitemap
        shell: python
        env:
          SITE_URL: "https://coyoteshkw.github.io/tiddlylog"
        run: |
          import os
          import urllib.parse

          # 1. 将 static 目录下编码的文件名还原为中文 (解决 404)
          path = 'output/static'
          if os.path.exists(path):
              for f in os.listdir(path):
                  if '%' in f:
                      old_path = os.path.join(path, f)
                      new_path = os.path.join(path, urllib.parse.unquote(f))
                      os.rename(old_path, new_path)

          # 2. 生成标准的 Sitemap
          site_url = os.environ['SITE_URL']
          sitemap_path = 'output/sitemap.xml'
          
          with open(sitemap_path, 'w', encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              f.write('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n')
              # 添加首页
              f.write(f'  <url><loc>{site_url}/index.html</loc></url>\n')
              
              # 添加所有静态文章 (进行 URL 编码)
              if os.path.exists(path):
                  for filename in sorted(os.listdir(path)):
                      if filename.endswith('.html') and filename != 'static.html':
                          encoded_name = urllib.parse.quote(filename)
                          f.write(f'  <url><loc>{site_url}/static/{encoded_name}</loc></url>\n')
              
              f.write('</urlset>')

      - name: Debug Output Structure
        run: ls -R output

      - name: Debug Output Structure
        run: |
          ls -R output

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # --- 核心：确保这里也是 output ---
          path: "output"

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
